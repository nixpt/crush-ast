[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
crush-diagnostics.workspace = true
crush-frontend.workspace = true
crush-vm.workspace = true
# `stdlib` for the corpus's `// caps: stdlib` annotation (see conformance.rs).
crush-lang-sdk = { workspace = true, features = ["stdlib"] }
serde_json.workspace = true
anyhow.workspace = true
regex = "1.10"

[[bin]]
name = "lint-dejavue"
path = "src/lint_dejavue.rs"

[[bin]]
name = "conformance"
path = "src/conformance.rs"

