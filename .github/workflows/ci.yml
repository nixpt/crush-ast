name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'agent/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ── Fast feedback: type-check the whole workspace ──────────────────────────
  check:
    name: Check (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nixpt/buckets
          path: buckets
      - run: mv buckets ..
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo check --workspace \
            --exclude crush-python \
            --exclude crush-lang-custom \
            2>&1

  # ── MSRV: the workspace builds on the declared rust-version ───────────────
  # Every other job runs whatever stable rust-toolchain.toml resolves to.
  # rust-toolchain.toml takes precedence over the toolchain a setup action
  # installs as default, so this job sets RUSTUP_TOOLCHAIN, which beats the
  # file, for every step including rust-cache's rustc probe. Keep the
  # version in step with `rust-version` in Cargo.toml (CRUSH-231).
  msrv:
    name: MSRV (1.95.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nixpt/buckets
          path: buckets
      - run: mv buckets ..
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - run: rustc --version
      - run: |
          cargo check --workspace \
            --exclude crush-python \
            --exclude crush-lang-custom \
            2>&1

  # ── Core VM + compiler tests ───────────────────────────────────────────────
  # `--lib --tests` (not bare `cargo test`): unit + `tests/*.rs` integration,
  # but skip doctests. Bare `cargo test` also runs rustdoc, and crush-cast's
  # `pub use crush_caison::…` re-export hits intermittent E0463 ("can't find
  # crate for crush_caison") under the multi `-p` invocation on CI runners —
  # green locally, red here. Integration coverage is the honesty goal
  # (CRUSH-65 math_builtins_test, crush-cast format_tests); doctests are not.
  # Prior `--lib`-only skipped those and let silent-wrong-answer bugs ship
  # under a green badge (CRUSH-CI-HONESTY-1).
  test-core:
    name: Test (core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nixpt/buckets
          path: buckets
      - run: mv buckets ..
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test --lib --tests \
            -p crush-walker-core \
            -p crush-vm \
            -p crush-cast \
            -p casm \
            -p crush-frontend \
            -p crush-jit \
            2>&1

  # ── AOT backends (Rust + C) ───────────────────────────────────────────────
  # crush-aot's tests build real .so files with rustc and gcc and compare what the
  # programs print with the VM. Test (workspace) only compiles them (`--no-run`),
  # so before this job none of them ran in CI. The second step reruns the C-runtime
  # tests with CRUSH_GC_STRESS=1 (a collection before every instruction), which
  # turns any value the collector fails to find into wrong output or a crash
  # (CRUSH-227). memory_bounds is left out of it: millions of iterations.
  test-aot:
    name: Test (aot)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nixpt/buckets
          path: buckets
      - run: mv buckets ..
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p crush-aot --lib --tests 2>&1
      - name: C runtime under GC stress
        env:
          CRUSH_GC_STRESS: "1"
        run: |
          cargo test -p crush-aot \
            --test stdout_parity \
            --test backend_agreement \
            --test examples_parity \
            --test integration_c \
            2>&1

  # ── Every other member's tests (CRUSH-231) ────────────────────────────────
  # Before this job, these crates were compiled by Test (workspace)
  # (`--no-run`) but no job ran their tests. With this job and the targeted
  # jobs, every workspace member's tests run somewhere. A new member must be
  # added to one of the `-p` lists, or excluded here with a reason.
  #
  # `--tests` (not bare `cargo test`) for the same doctest reason as Test
  # (core). It also takes in bin-only crates (crush-walker, crush-installer,
  # crush-tui), where `--lib` would match nothing.
  #
  # crush-lang-custom is still left out of Check/Clippy/Feature gates, but it
  # builds and its tests pass, so it runs here. crush-python links libpython
  # (pyo3, abi3-py311): setup-python provides a shared libpython.
  #
  # No tests yet, but kept in the list so new ones run without a CI change:
  # crush-cson, crush-ffi, crush-plugin-example, crush-tui, tree-sitter-crush
  # (its grammar corpus needs the tree-sitter CLI, which this job doesn't run).
  test-rest:
    name: Test (rest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nixpt/buckets
          path: buckets
      - run: mv buckets ..
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test --tests \
            -p crush-errors \
            -p crush-caison \
            -p crush-cson \
            -p crush-diagnostics \
            -p crush-macros \
            -p tree-sitter-crush \
            -p crush-walker \
            -p xtask \
            -p crush-lang-custom \
            -p crush-lang-java \
            -p crush-lang-wasm \
            -p crush-index \
            -p crush-net \
            -p crush-ptx \
            -p crush-lint \
            -p crush-ffi \
            -p crush-plugin-example \
            -p crush-installer \
            -p crush-debugger \
            -p crush-tui \
            -p crush-vm-capi \
            -p crush-aotc \
            -p crush-python \
            2>&1

  # ── All language SDK tests ────────────────────────────────────────────────
  test-languages:
    name: Test (walkers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nixpt/buckets
          path: buckets
      - run: mv buckets ..
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test \
            -p crush-lang-python \
            -p crush-lang-js \
            -p crush-lang-rust \
            -p crush-lang-c \
            -p crush-lang-bash \
            -p crush-lang-zsh \
            -p crush-lang-nepali \
            -p crush-lang-go \
            -p crush-lang-zig \
            -p crush-lang-dart \
            2>&1

  # ── crush-lang-sdk tests (blocking) — CRUSH-104 ───────────────────────────
  # The SDK is what embedders pull from crates.io, and its suite carries the
  # polyglot capability-gate tests (tests/polyglot_capability_test.rs): no
  # `@lang` block spawns without a `polyglot.<lang>` grant, and a language
  # outside the allowlist is refused even with every grant. crates.io's 0.2.0
  # SDK shipped without that gate; nothing ran these tests in CI, so a
  # regression would have shipped the same way. Default features on purpose:
  # that is the feature set `cargo add crush-lang-sdk` gets.
  #
  # crush-pkg rides along (CRUSH-172): it sits on top of the SDK, so the extra
  # cost is its own crate, and until now no job ran its tests at all (`Test
  # (workspace)` is `--no-run`). Its suite drives the real `crush-pkg` binary
  # over the example capsules in `examples/crush/capsules/`.
  test-sdk:
    name: Test (sdk)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nixpt/buckets
          path: buckets
      - run: mv buckets ..
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test -p crush-lang-sdk -p crush-pkg --lib --tests 2>&1

  # ── Whole-workspace test build (blocking) ─────────────────────────────────
  # The job that did not exist, and whose absence let a fixed bug come back.
  #
  # `Test (core)` and `Test (walkers)` run explicit `-p` lists. A `-p` list
  # never builds the workspace's units together, so it structurally cannot
  # catch a *cross-crate build-graph* fault — only a whole-workspace resolve
  # does. That is exactly the class of bug CRUSH-16 fixed (crush-vm was
  # `crate-type = ["lib", "cdylib"]`, which drops cargo's filename hash, so
  # two `crush-vm` units raced to write one `deps/libcrush_vm.rlib` and
  # consumers linked whichever won — surfacing as `E0308 ... found a
  # different casm::Program`, or intermittently as `E0463: can't find crate`).
  # The PyO3 wheel commit re-added the cdylib, silently reverting CRUSH-16,
  # and every green badge on this repo stayed green for months.
  #
  # `--no-run` on purpose: this job's job is to prove the workspace *resolves
  # and builds as one graph*. Actually running the suites is `Test (core)` and
  # `Test (walkers)`, which are faster and already sharded. Keeping this build
  # -only also keeps it honest about what it gates — no flaky runtime tests
  # here, so a red here always means a real graph fault.
  #
  # Same excludes as `Check (workspace)` (crush-python needs libpython dev
  # headers on the runner). `crush-vm-py` needs no exclude at all — it is not
  # a workspace member, by design: a crate whose whole job is to keep a cdylib
  # out of this graph should not be in it. That is the invariant this job
  # gates from the other side, by proving crush-vm still builds as a plain lib
  # alongside everything that depends on it.
  test-workspace:
    name: Test (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nixpt/buckets
          path: buckets
      - run: mv buckets ..
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test --workspace --no-run \
            --exclude crush-python \
            --exclude crush-lang-custom \
            2>&1

  # ── Linting (blocking) ────────────────────────────────────────────────────
  # Previously: `continue-on-error: true` AND `|| true` — two independent reasons
  # the job could never go red. Full `-D warnings` is still too much pre-existing
  # style debt to flip in one PR; deny correctness lints that must stay red-capable.
  lint:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nixpt/buckets
          path: buckets
      - run: mv buckets ..
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo clippy --workspace \
            --exclude crush-python \
            --exclude crush-lang-custom \
            -- -D clippy::never_loop

  # ── Release build compiles (no LTO, just verify release profile works) ────
  # `cache-targets: false` (CRUSH-CI-CACHE-1) — this job must NOT restore a
  # `target/` directory. It was passing for the wrong reason.
  #
  # `rust-cache` keys on a hash of Cargo.lock and falls back to a restore-key
  # when that misses. A restored release `target/` then contains `ort-sys`'s
  # compiled lib from a *different* lock state, while the build-script output
  # carrying the `-L` search path for the downloaded onnxruntime no longer
  # lines up — so the relink fails with:
  #
  #     error: could not find native static library `onnxruntime`,
  #            perhaps an -L flag is missing?
  #
  # That is not a code fault: a genuinely cold build of the same crates works
  # (the `Test (workspace)` job, first run of a new job name and therefore
  # cacheless, compiles `ort-sys` from scratch and passes). The failure only
  # appears on a PARTIAL restore, which is why `main` looked green — its exact
  # key kept hitting. An earlier `main` run logging `full match: false` passed
  # only because it never rebuilt `ort-sys` at all.
  #
  # So the green here was reporting "the cache is warm", not "the release
  # profile builds". Dropping target caching costs wall-clock and buys back the
  # thing the job exists to prove. The registry/bin caches are still kept, so
  # dependency *downloads* are not repeated; only compilation is.
  build-release:
    name: Build (release)
    runs-on: ubuntu-latest
    # Raised from 25: a cold release build of 11 packages has no warm target to
    # lean on any more.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nixpt/buckets
          path: buckets
      - run: mv buckets ..
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: |
          cargo build --release \
            -p crush-aot \
            -p crush-vm \
            -p crush-lang-sdk \
            -p crush-lang-python \
            -p crush-lang-js \
            -p crush-lang-rust \
            -p crush-lang-c \
            -p crush-lang-bash \
            -p crush-lang-go \
            -p crush-lang-zig \
            -p crush-lang-dart \
            2>&1

  # ── Feature-gate smoke tests (blocking) ───────────────────────────────────
  # Previously muted with continue-on-error + `|| true`. Keep the same excludes
  # as Check so pyo3/crush-python stays out of the matrix.
  feature-gates:
    name: Feature gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        args: ["--no-default-features", "--all-features"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nixpt/buckets
          path: buckets
      - run: mv buckets ..
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo check --workspace \
            --exclude crush-python \
            --exclude crush-lang-custom \
            ${{ matrix.args }} 2>&1

  # ── crush-web: native tests + headless Chromium (blocking) ────────────────
  # crush-web is excluded from the workspace (own Cargo.lock, wasm32 target),
  # so no other job builds it. The browser run plays
  # examples/crush/blackjack_interactive.crush through `Session` (pause on
  # io.read, resume on provide) and `execute_with({ stdin })` — wasm32-only
  # behaviour (no process stdin) that native tests can't see.
  web:
    name: crush-web (native tests + headless Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nixpt/buckets
          path: buckets
      - run: mv buckets ..
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/crush-web
      - name: Native tests
        working-directory: crates/crush-web
        run: cargo test
      # The CLI must match the wasm-bindgen version in crush-web's Cargo.lock.
      - name: Install the matching wasm-bindgen CLI
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3 }' crates/crush-web/Cargo.lock)
          cargo install wasm-bindgen-cli --version "${v}" --locked
      - name: Install playwright + Chromium
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Play blackjack in headless Chromium
        run: crates/crush-web/scripts/browser-test.sh
