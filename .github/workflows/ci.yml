name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'agent/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ── Fast feedback: type-check the whole workspace ──────────────────────────
  check:
    name: Check (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nixpt/buckets
          path: buckets
      - run: mv buckets ..
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo check --workspace \
            --exclude crush-python \
            --exclude crush-lang-custom \
            2>&1

  # ── Core VM + compiler tests ───────────────────────────────────────────────
  # NOTE: do NOT pass `--lib` — that skips `tests/*.rs` integration tests.
  # CRUSH-65's math_builtins_test and crush-cast's format_tests only live there;
  # `--lib` was why silent-wrong-answer bugs and golden-fixture drift could ship
  # under a green CI badge (CRUSH-CI-HONESTY-1).
  test-core:
    name: Test (core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nixpt/buckets
          path: buckets
      - run: mv buckets ..
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test \
            -p crush-walker-core \
            -p crush-vm \
            -p crush-cast \
            -p casm \
            -p crush-frontend \
            2>&1

  # ── All language SDK tests ────────────────────────────────────────────────
  test-languages:
    name: Test (walkers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nixpt/buckets
          path: buckets
      - run: mv buckets ..
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test \
            -p crush-lang-python \
            -p crush-lang-js \
            -p crush-lang-rust \
            -p crush-lang-c \
            -p crush-lang-bash \
            -p crush-lang-zsh \
            -p crush-lang-nepali \
            -p crush-lang-go \
            -p crush-lang-zig \
            -p crush-lang-dart \
            2>&1

  # ── Linting (blocking) ────────────────────────────────────────────────────
  # Previously: `continue-on-error: true` AND `|| true` — two independent reasons
  # the job could never go red. Full `-D warnings` is still too much pre-existing
  # style debt to flip in one PR; deny correctness lints that must stay red-capable.
  lint:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nixpt/buckets
          path: buckets
      - run: mv buckets ..
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo clippy --workspace \
            --exclude crush-python \
            --exclude crush-lang-custom \
            -- -D clippy::never_loop

  # ── Release build compiles (no LTO, just verify release profile works) ────
  build-release:
    name: Build (release)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nixpt/buckets
          path: buckets
      - run: mv buckets ..
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo build --release \
            -p crush-aot \
            -p crush-vm \
            -p crush-lang-sdk \
            -p crush-lang-python \
            -p crush-lang-js \
            -p crush-lang-rust \
            -p crush-lang-c \
            -p crush-lang-bash \
            -p crush-lang-go \
            -p crush-lang-zig \
            -p crush-lang-dart \
            2>&1

  # ── Feature-gate smoke tests (blocking) ───────────────────────────────────
  # Previously muted with continue-on-error + `|| true`. Keep the same excludes
  # as Check so pyo3/crush-python stays out of the matrix.
  feature-gates:
    name: Feature gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        args: ["--no-default-features", "--all-features"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nixpt/buckets
          path: buckets
      - run: mv buckets ..
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo check --workspace \
            --exclude crush-python \
            --exclude crush-lang-custom \
            ${{ matrix.args }} 2>&1
