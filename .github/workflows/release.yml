name: release

# Bumps the workspace version on every push to main (i.e. after a
# merge), then tags vX.Y.Z. Bump logic lives in scripts/bump-version.sh
# (installed by squadron/bin/bump-version --install) so it runs standalone in
# CI with no squadron/bin on PATH.
#
# branches/BUMPVER_MAIN_BRANCH below are this repo's ACTUAL default branch,
# detected at install time (not hardcoded 'main' — see squadron/bin/bump-
# version's detect_default_branch(); a repo whose default is master got a
# release job that could never fire on a real push before this).
#
# Loop-safe: pushes made with the default GITHUB_TOKEN do NOT trigger new
# workflow runs (a deliberate GitHub behavior), so the bump commit won't
# recurse. The commit message also carries [skip ci].
# Trigger is workflow_dispatch ONLY (2026-09-02, account-wide Actions-usage trim):
# release/bump used to fire on every push to main.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write # dispatch release-artifacts.yml for the new tag (CRUSH-342)

jobs:
  bump:
    runs-on: ubuntu-latest
    if: github.actor != 'crush-ast-release'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags are needed for `git describe`
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        if: hashFiles('Cargo.toml') != ''
      - name: bump + tag + push
        env:
          BUMPVER_MAIN_BRANCH: main
          BUMPVER_GIT_USER: crush-ast-release
          BUMPVER_GIT_EMAIL: release@crush-ast.local
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # so `gh release create` inside the script authenticates
        run: ./scripts/bump-version.sh
      # Prebuilt artifacts for the tag just pushed (CRUSH-342). A tag pushed with
      # GITHUB_TOKEN starts no `on: push: tags` workflow, but workflow_dispatch
      # from GITHUB_TOKEN is allowed, so start it explicitly. Only when HEAD is
      # actually tagged (the script exits early with nothing to release).
      - name: dispatch release-artifacts for the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if tag=$(git describe --tags --exact-match HEAD 2>/dev/null) && [[ "$tag" == v* ]]; then
            gh workflow run artifacts.yml --ref main -f tag="$tag"
            echo "dispatched release-artifacts for $tag"
          else
            echo "HEAD is not a release tag — nothing to build"
          fi
