[package]
name = "crush-lint"
description = "AI-augmented linter for Crush — an ONNX-backed engine that supplements standard compiler diagnostics."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
crush-diagnostics = { path = "../crush-diagnostics", version = "0.3.0" }
# CRUSH-26: explicit `features = ["download-binaries"]` so ort-sys
# fetches a prebuilt ONNX Runtime at build time on any clean runner
# (CI's ubuntu-latest has no system onnxruntime). The "Same version
# used in crush-vm" comment is a stale lie — crush-vm pins rc.12 and
# this file pins rc.2; cargo's prerelease semver resolves both to
# rc.12 anyway, so adding download-binaries here is what actually
# activates the vendored-binary path for the lint model on CI.
# Version alignment to rc.12 is intentionally deferred — CRUSH-26 is
# a time-sensitive build-fix, not a version-pin houseclean.
ort = { version = "2.0.0-rc.2", features = ["download-binaries"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12.5"

