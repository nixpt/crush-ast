[package]
name = "crush-lang-js"
version.workspace = true
edition = "2024"
description = "JavaScript/TypeScript language support for Crush — JS/TS frontend: boa_parser for JS, swc for TS (and for JS until CRUSH-250 flips the default)"
readme = "../../README.md"
license.workspace = true
repository.workspace = true

[[bin]]
name = "js_walker"
path = "src/bin/walker.rs"

[features]
# `.js` still lowers through swc by default (swc wins while `swc-backend` is
# on). `js-boa` is built too so the parity harness runs it on every build.
# CRUSH-250 step 6 flips `.js` to boa once the harness says boa >= swc in
# every area, then retires the swc lowering for JS (swc then remains only
# behind `ts`).
default = ["swc-backend", "ts", "js-boa"]
# The swc parser and its JS lowering (`lower_swc.rs`). While it is on, it
# lowers `.js`/`.mjs`/`.cjs`/`.jsx`; the browser build leaves it off.
swc-backend = ["dep:swc_ecma_parser", "dep:swc_ecma_ast", "dep:swc_common", "dep:swc_atoms"]
# TypeScript (`.ts`/`.tsx`/`.mts`). Today through the swc lowering; with
# CRUSH-zorro-8, through swc type-stripping into the boa lowering.
ts = ["swc-backend"]
# The `boa_parser` 0.22 frontend (CRUSH-250): no swc. Lowers `.js` when
# `swc-backend` is off, and is what `freevars` (the `@javascript {}` polyglot
# analysis) uses whenever it is on.
js-boa = ["dep:boa_ast", "dep:boa_parser", "dep:boa_interner"]

[dependencies]
crush-cast.workspace = true
crush-walker-core = { path = "../crush-walker-core", version = "0.7.0", default-features = false }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
swc_ecma_parser = { version = "41", optional = true }
swc_ecma_ast = { version = "25", optional = true }
swc_common = { version = "23", optional = true }
swc_atoms = { version = "9", optional = true }
# One Boa version across crush-ast, bozo and surfer (which is on 0.22).
boa_parser = { version = "0.22", optional = true }
boa_ast = { version = "0.22", optional = true }
boa_interner = { version = "0.22", optional = true }

[dev-dependencies]
crush-frontend = { path = "../crush-frontend" }
# "stdlib" registers the math.* host capabilities that JS Math.min/Math.max
# lower to (see math_builtin in lower_swc.rs / CRUSH-39).
crush-lang-sdk = { path = "../crush-lang-sdk", default-features = false, features = ["stdlib", "native-plugins"] }
crush-vm = { path = "../crush-vm" }
crush-lang-python = { path = "../crush-lang-python" }
