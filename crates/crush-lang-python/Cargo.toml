[package]
name = "crush-lang-python"
version.workspace = true
edition = "2024"
description = "Python language support for Crush — parser + CAST lowering backed by rustpython-parser"
readme = "../../README.md"
license.workspace = true
repository.workspace = true

[[bin]]
name = "python_walker"
path = "src/bin/walker.rs"

[dependencies]
crush-cast.workspace = true
# Direct path dep, not `.workspace = true`: a workspace-inherited dep
# cannot turn off default features, and walker-core's default
# `tree-sitter` feature pulls C sources that do not build for wasm32.
# The Python walker uses only the `Frontend` trait / `LowerCtx` /
# `FeatureReport` surface, which is always available (same as
# crush-lang-js). CI checks `--target wasm32-unknown-unknown`.
crush-walker-core = { path = "../crush-walker-core", version = "0.7.0", default-features = false }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rustpython-parser = "0.4"
rustpython-ast = "0.4"

[dev-dependencies]
crush-frontend = { path = "../crush-frontend" }
crush-lang-sdk = { path = "../crush-lang-sdk" }
crush-vm = { path = "../crush-vm" }
