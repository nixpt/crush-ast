[package]
name = "crush-vm"
version.workspace = true
edition = "2024"
repository.workspace = true
homepage.workspace = true
description = "CVM1 binary bytecode assembler, disassembler, and sandboxed interpreter — standalone Crush runtime outside exosphere"
license.workspace = true
readme = "README.md"
keywords = ["crush", "vm", "bytecode", "interpreter", "sandbox"]
categories = ["compilers"]

[[bin]]
name = "crush-vm"
path = "src/main.rs"

[lib]
name = "crush_vm"
# MUST stay a plain `lib` — do NOT add `cdylib`/`staticlib` here.
#
# Cargo drops the `-C extra-filename=-<hash>` suffix for any target whose
# crate-type includes a non-rlib output, so this crate's rlib would be
# written to one fixed path (`deps/libcrush_vm.rlib`). The workspace builds
# two `crush-vm` units — target graph, plus a host-graph one via the
# proc-macro crate `crush-macros` (its tests depend on crush-vm) — and both
# would write that same path, last-writer-wins, silently giving consumers a
# `crush_vm` linked against a different `casm` than their `crush_frontend`
# (`E0308: ... found a different casm::Program`).
#
# This was CRUSH-16; the `cdylib` was re-added by the PyO3 wheel commit
# `4137646` and regressed it. The bindings now live in `crush-vm-py`, the C
# ABI in `crush-vm-capi`. CI's `Test (workspace)` job gates this.
crate-type = ["lib"]

[dependencies]
anyhow.workspace = true
casm.workspace = true
hex = "0.4"
crush-errors.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Canonical NDJSON wire-format helpers (DiagRecord + diag_line +
# diag_line_from + wants_json). Replaces the previously inlined
# seven-field-shape trio in `src/main.rs::tests`; canonical wire-
# format lockdown lives in `crates/crush-diagnostics/tests/wire_format.rs`.
crush-diagnostics.workspace = true
parking_lot = "0.12.5"
# (pyo3 moved to the `crush-vm-py` crate along with the bindings — keeping it
# here forced this crate to be a cdylib. See the `[lib]` note above.)

# Native-only: ONNX inference (ai_optimizer), dynamic plugin loading (plugin,
# via crush-ffi's C-ABI contract), and the `os.cargo` subprocess capability
# (cargo_cap). None of these have a wasm32 story — ort needs a native ONNX
# runtime, libloading needs a real dynamic linker, cargo_cap needs a real
# `cargo` binary to spawn. Gated so `crush-web` (browser target) can build
# with `default-features = false`.
# CRUSH-26: explicit `features = ["download-binaries"]`. With
# `ort` 2.0.0-rc.12 this feature is already in the crate's own default
# list, so listing it explicitly is purely defensive — visible-in-source
# for the build-time intent, and forward-safe if a future release ever
# moves it out of defaults. `default-features` is left implicit (true),
# per cargo additive-union semantics — defaults stay on, listed features
# are enabled IN ADDITION. This pins the vendored-onnxruntime path on
# any clean runner (CI has no system onnxruntime), pulling in `ureq` /
# `lzma-rust2` / `hmac-sha256` as `ort-sys` build-deps via
# `~/.cargo/registry/src/.../ort-sys-2.0.0-rc.12/Cargo.toml`.
ort = { version = "2.0.0-rc.12", optional = true, features = ["download-binaries"] }
libloading = { version = "0.9.0", optional = true }
crush-ffi = { version = "0.3.0", path = "../crush-ffi", optional = true }

# CRUSH-20: the 4th, sandboxed `EXEC_LANG` execution path. Optional + off by
# default (same pattern as `python`/`native-plugins` above) so crush-vm stays
# dep-light for consumers who don't want it. Path is relative to a sibling
# `buckets` checkout at the worktrees root (same convention already used by
# crush-pkg's own `buckets` dep, see that crate's Cargo.toml) — NOT the
# absolute path the CRUSHAST-BUCKETSPIKE-1/2 spike used, which was
# deliberately throwaway-only. Package is published as `crush-buckets`
# ("buckets" was already taken on crates.io); the CLI binary/repo name stays
# "buckets".
buckets = { package = "crush-buckets", path = "../../../buckets", version = "0.1.0", optional = true }

[features]
default = ["native-plugins"]
# `python` removed (CRUSH-WORKSPACE-TEST-1) — the PyO3 bindings it gated now
# live in the `crush-vm-py` crate, which builds the same `crush_vm` wheel.
# The feature only ever made sense for a cdylib build, and requiring it here
# is what forced this crate's crate-type. Build the wheel from
# `crates/crush-vm-py` instead.
native-plugins = ["dep:ort", "dep:libloading", "dep:crush-ffi"]
# See CRUSH-20 dejavue decision: crush-vm (not crush-lang-sdk) owns the
# buckets dependency directly, because EXEC_LANG's actual spawn point lives
# here and crush-lang-sdk depends on crush-vm, not the reverse.
sandboxed-polyglot = ["dep:buckets"]

# `EXEC_LANG`'s wall-clock timeout must kill a polyglot subprocess's whole
# process GROUP, not just the single tracked PID: `bash -c "sleep 30"`
# forks `sleep` as bash's own child, which inherits bash's stdout/stderr
# pipe fds — killing bash alone leaves `sleep` running and still holding
# those fds open, so the pipe never sees EOF. `std::process::Command` has
# no "kill the process group" primitive, only single-PID `Child::kill()`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
