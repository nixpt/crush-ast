[package]
name = "crush-lang-sdk"
version.workspace = true
edition = "2024"
description = "Rust SDK for hosting and extending the crush-vm CVM1 runtime"
license.workspace = true
repository = "https://github.com/nixpt/crush-ast"
homepage.workspace = true
readme = "README.md"
keywords = ["crush", "sdk", "vm", "scripting", "embedding"]
categories = ["development-tools", "compilers"]

[[bin]]
name = "crush-run"
path = "src/bin/crush-run.rs"

[[bin]]
name = "crush-compile"
path = "src/bin/crush-compile.rs"

[[bin]]
name = "crush-repl"
path = "src/bin/crush-repl.rs"

[[bin]]
name = "crushc"
path = "src/bin/crushc.rs"

[[bin]]
name = "crush"
path = "src/bin/crush.rs"

[[bin]]
name = "crush-debug"
path = "src/bin/crush-debug.rs"
required-features = ["debug"]

[features]
# `crush-debug` / `crush debug`: the interactive debugger (CRUSH-317). Pulls
# crush-debugger, whose crush-vm dependency has default features, so the wasm
# build (crush-web) leaves it off along with the other defaults.
debug = ["dep:crush-debugger"]
default = ["native-plugins", "debug", "tcp", "tcp-tls", "polyglot-python", "polyglot-javascript", "polyglot-javascript-swc", "polyglot-rust", "stdlib", "net"]
# `net.http_*` (ureq). On by default (CRUSH-264): still grant-gated, a program
# using `net.*` is refused unless run with `--net`. Cargo features are
# per-package, not per-binary, so the binaries cannot take it alone; embedders
# that want no HTTP client opt out with `default-features = false`.
net = ["dep:ureq"]
# Raw TCP/TLS sockets as `tcp.*` host capabilities (crush-net, CRUSH-318).
# Granted by `--tcp` (client: connect/send/recv/close/ping/tls_wrap) and, more
# strongly, `--tcp-listen` (server: listen/accept). Separate from `net`
# (HTTP-client only) and from `--net`; compiled in by default but never
# granted by default. `tcp-tls` adds `tcp.tls_wrap` (rustls, ring).
tcp = ["dep:crush-net"]
tcp-tls = ["tcp", "crush-net/tls"]
# `db.query` / `db.execute` (rusqlite, bundled SQLite). Opt-in: build with
# `--features db` (CRUSH-264).
db = ["dep:rusqlite"]
graphics = []
# Pure-computation stdcaps (str/math/conv/collections/json/path/regex/...).
# On by default (CRUSH-113, decision C-1): they confer no authority, so the
# binaries register them without a flag. Embedded/wasm builds can opt out with
# `default-features = false`; `--stdlib` then fails loudly instead of no-oping.
stdlib = ["dep:regex"]
repl-helper = ["dep:rustyline"]
# `gpu.launch` (CRUSH-zorro-3): run a crush kernel on an NVIDIA GPU. Off by default —
# it pulls in the CUDA driver bindings (loaded at runtime, so building needs no CUDA
# toolkit) and crush-ptx. `crush run --gpu` grants it.
gpu = ["dep:crush-ptx", "dep:cudarc"]
# crush-diff's differential module compares against crush-vm's FastVM
# backend, which needs crush-vm's own native-plugins (libloading — no
# wasm32 story). Default on so `crush-run`/`crush-compile`/`crush-repl`/
# `crushc`/`crush-diff` keep working exactly as before; crush-web is the
# only consumer that opts out.
native-plugins = ["crush-vm/native-plugins"]
# @python{} free-variable analysis (marshaling prep in compile.rs) and inline
# lowering (`PolyglotMode::Lower`, CRUSH-272), via crush-lang-python
# (rustpython-parser, pure Rust). Builds for wasm32: crush-lang-python takes
# crush-walker-core without its tree-sitter default.
polyglot-python = ["dep:crush-lang-python"]
polyglot-rust = ["dep:crush-lang-rust"]
# @javascript{} free-variable analysis + guest rewrite (CRUSH-68), via
# crush-lang-js; the analysis and inline lowering run on `boa_parser`
# (CRUSH-250). boa only: crush-web (the browser build) uses just this.
polyglot-javascript = ["dep:crush-lang-js", "crush-lang-js/js-boa"]
# The swc parser and its whole-file `.js` lowering (what `JsAdapter` /
# `compile_source("js", …)` use while it is on). On by default, and stays until
# CRUSH-250 step 6 makes boa the `.js` lowering: without it, `.js` files get the
# boa lowering early. Kept separate from `polyglot-javascript` because the
# browser build never lowers a whole `.js` file, and swc alone is ~1.1 MB of
# its wasm.
polyglot-javascript-swc = ["polyglot-javascript", "crush-lang-js/swc-backend"]
# TypeScript support in crush-lang-js (swc), for consumers that walk `.ts`
# through the SDK. Off by default.
polyglot-typescript = ["polyglot-javascript-swc", "crush-lang-js/ts"]

[dependencies]
crush-vm = { path = "../crush-vm", version = "0.8.0", default-features = false }
chrono.workspace = true
crush-cast.workspace = true
casm.workspace = true
crush-frontend.workspace = true
crush-debugger = { path = "../crush-debugger", version = "0.8.0", optional = true }
crush-diagnostics.workspace = true
crush-lang-python = { path = "../crush-lang-python", version = "0.8.0", optional = true }
crush-lang-rust = { path = "../crush-lang-rust", version = "0.8.0", optional = true }
crush-lang-js = { path = "../crush-lang-js", version = "0.8.0", optional = true, default-features = false }
crush-walker-core-no-tree-sitter.workspace = true
crush-net = { path = "../crush-net", version = "0.8.0", optional = true, default-features = false }
crush-ptx = { path = "../crush-ptx", version = "0.8.0", optional = true }
cudarc = { version = "0.11", features = ["driver", "nvrtc", "cuda-12040"], optional = true }
crush-errors.workspace = true
crush-index.workspace = true
crush-caison.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
sha2 = { version = "0.10", default-features = false, features = ["std"] }
base64 = "0.22"
rand = { version = "0.8", features = ["std", "std_rng"] }
clap.workspace = true
ureq = { version = "2", optional = true }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
regex = { version = "1.10", optional = true }
rustyline = { version = "10.0", optional = true }
yansi.workspace = true

# wasm32 has no OS RNG; `rand`'s getrandom-0.2 backend needs the `js` source.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
crush-cast = { workspace = true }
crush-frontend = { workspace = true }
crush-cosm = { workspace = true }
crush-index = { workspace = true }
tempfile = "3"
